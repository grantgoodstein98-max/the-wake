<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <!-- The web build, made for an iPhone in landscape: added to the Home Screen it opens full-screen with no browser bars. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="The Wake">
    <meta name="theme-color" content="#070b14">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" href="icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">
    <title>The Wake</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070b14; }
      body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* Kept clear of the notch / Dynamic Island and the home bar. */
      #unity-canvas { position: absolute; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); right: env(safe-area-inset-right); width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right)); height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)); display: block; background: #070b14; outline: none; }
      .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #070b14; color: #e8e2d4; font: 600 16px/1.4 -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.12em; text-align: center; padding: 24px; box-sizing: border-box; }
      #loading .bar { width: min(60vw, 420px); height: 6px; background: #1b2436; border-radius: 3px; overflow: hidden; }
      #loading .fill { width: 0; height: 100%; background: #3dd6e0; transition: width 0.2s; }
      #loading .note { font-weight: 400; font-size: 13px; letter-spacing: 0.04em; color: #7a869e; max-width: 34em; }
      #rotate { display: none; z-index: 10; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      #error { display: none; z-index: 20; color: #ff8a7a; font-weight: 400; letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading" class="screen">
      <div>THE WAKE</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="note" id="note">Loading v1.7…</div>
    </div>
    <div id="rotate" class="screen">
      <div style="font-size: 44px;">⟳</div>
      <div>TURN YOUR PHONE SIDEWAYS</div>
    </div>
    <div id="error" class="screen"></div>
    <script src="Build/2a85ec7db4757e54b1924ca9304f6a15.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isPhone = /iPhone|iPod|Android/i.test(navigator.userAgent);
      if (isPhone && !navigator.standalone && !window.matchMedia("(display-mode: standalone)").matches)
        document.querySelector("#note").textContent = "Tip: tap Share → Add to Home Screen to play full-screen.";

      // A long press is the game's right-click: stop iOS from popping its own menu or magnifier over the canvas.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/48c6902b40e1703c531e0b66c703c9f1.data.unityweb",
        frameworkUrl: "Build/83c1be7ed800ababd182985f9ee0362f.framework.js.unityweb",
        codeUrl: "Build/129c37318f080e0dad869422e221df14.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "grant-nuck-friend-slop-game",
        productVersion: "1.7",
        // Saves (PlayerPrefs) are written to the browser's storage as they change, not only on a clean quit.
        autoSyncPersistentDataPath: true,
        // The screen's full sharpness: the layout's small text is only readable on a phone drawn at its real resolution.
        devicePixelRatio: window.devicePixelRatio || 1,
      }, function (progress) {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
      }).catch(function (message) {
        var error = document.querySelector("#error");
        error.textContent = "The game couldn't start: " + message;
        error.style.display = "flex";
      });
    </script>
  </body>
</html>
